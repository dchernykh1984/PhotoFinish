name: Security Audit

on:
  schedule:
    - cron: "0 9 * * 6" # every Saturday at 09:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Export dependencies
        # Platform markers stripped: audit the Windows and macOS build packages
        # (pefile, pywin32-ctypes, macholib) too, not only what Linux installs.
        run: >-
          uv export --locked --no-hashes --no-annotate --no-default-groups
          --group build --no-emit-project | sed 's/ ;.*//' > requirements.txt
      - name: Run pip-audit
        run: uvx pip-audit --disable-pip --no-deps -r requirements.txt
