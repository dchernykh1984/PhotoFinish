# Spec Kit's own files are generated by `specify` and refreshed by `specify integration upgrade`,
# which keeps any file it finds edited instead of updating it -- so no hook may rewrite them, and
# their typographic punctuation is theirs. The constitution is ours and is checked like any file.
exclude: ^(\.specify/(?!memory/constitution\.md$)|\.(claude|agents)/skills/speckit-[^/]+/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  # ruff, mypy and commitizen run from uv.lock: the edit hooks and CI use the
  # same versions, dependabot bumps them in one place, and mypy sees PySide6.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        args: [--scripts-are-modules]
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: commitizen
        name: commitizen check
        entry: uv run --frozen cz check
        args: [--allow-abort, --commit-msg-file]
        language: system
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: no-non-ascii
        name: no non-ASCII characters
        language: pygrep
        entry: '[^\x00-\x7f]'
        types_or: [python, yaml, markdown, toml, shell, json]
        # CHANGELOG.md is generated by release-please from commit messages,
        # which may legitimately contain non-ASCII text.
        exclude: ^(uv\.lock|CHANGELOG\.md)$

  - repo: local
    hooks:
      - id: coding-agent-hook-tests
        name: coding agent hook tests
        entry: python .codex/hooks/test_post_edit.py
        language: python
        files: ^\.codex/
        pass_filenames: false
